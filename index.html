
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Mar - Canvas</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #ffffff;
      font-family: sans-serif;
    }
    canvas {
      background: #000000;
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
      border-radius: 8px;
      max-width: 100%;
      max-height: 100vh;
    }
  </style>
</head>
<body>

  <canvas id="meu-mar" width="800" height="600"></canvas>

  <script>
    const tela = document.getElementById('meu-mar');
    const ctx = tela.getContext('2d');

    // Fundo do Canvas
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, tela.width, tela.height);

    // Exemplo de elemento visual (Onda do Mar)
    ctx.beginPath();
    ctx.arc(400, 300, 150, 0, Math.PI * 2);
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 4;
    ctx.stroke();
  </script>

</body>
</html>
