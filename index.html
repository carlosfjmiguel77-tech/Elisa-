<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Mar - Canvas</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
      font-family: sans-serif;
    }
    h1 {
      color: #00ffcc;
      margin-bottom: 10px;
    }
    canvas {
      background: #000000;
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
      border-radius: 8px;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <h1>elisa</h1>
  <canvas id="meu-mar">

  <script>
    const tela = document.getElementById('meu-mar');
    const ctx = tela.getContext('2d');

    // Fundo do Canvas
    ctx.fillStyle = '#111111';
    ctx.fillRect(0, 0, tela.width, tela.height);

    // Círculo Verde-Água
    ctx.beginPath();
    ctx.arc(tela.width / 2, tela.height / 2, 150, 0, Math.PI * 2);
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 6;
    ctx.stroke();
  </script>

</body>
</html>

</html>
